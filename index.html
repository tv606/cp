<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .link-btn {
            display: block;
            background-color: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid #333333;
            font-weight: 600;
            word-break: break-all;
        }
        .link-btn:hover {
            background-color: #2a2a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://tinyurl.com/3wyjv383" class="link-btn" target="_blank" rel="noopener noreferrer">Link 1</a>
        <a href="https://tinyurl.com/yc6792mv" class="link-btn" target="_blank" rel="noopener noreferrer">Link 2</a>
        <a href="https://tinyurl.com/57ssjbvd" class="link-btn" target="_blank" rel="noopener noreferrer">Link 3</a>
        <a href="https://tinyurl.com/xft9x2b5" class="link-btn" target="_blank" rel="noopener noreferrer">Link 4</a>
        <a href="https://tinyurl.com/ypzywbrx" class="link-btn" target="_blank" rel="noopener noreferrer">Link 5</a>
    </div>
</body>
</html>
